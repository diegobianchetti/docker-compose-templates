# conf.d/registry.conf — proxy para o Docker Registry com autenticação básica
# Substitua `registry.example.br` pelo FQDN real do registry.

server {
    listen 443 ssl;
    server_name registry.example.br;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Sem limite de tamanho de body — necessário para push de layers grandes
    client_max_body_size 0;

    # Desabilita buffering de request body no nginx para evitar timeout
    # em uploads grandes (layers de imagens podem ter vários GBs)
    proxy_request_buffering off;

    # Autenticação HTTP básica com bcrypt
    auth_basic           "Docker Registry — Acesso Restrito";
    auth_basic_user_file /etc/nginx/htpasswd;

    location / {
        proxy_pass                          http://registry:5000;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;

        # Headers obrigatórios para o protocolo Docker Registry v2
        proxy_set_header  Docker-Distribution-Api-Version registry/2.0;

        # Timeouts altos para push/pull de imagens grandes
        proxy_read_timeout    900;
        proxy_connect_timeout 10;
        proxy_send_timeout    900;
    }
}
