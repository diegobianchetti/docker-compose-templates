# conf.d/app.conf — server block da aplicação
# Substitua `app.example.br` pelo domínio real.

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name app.example.br;

    # Endpoint de health para o healthcheck do nginx no docker-compose.yml
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS com proxy reverso para o serviço `app`
server {
    listen 443 ssl;
    server_name app.example.br;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Proxy para o container `app` — resolvido pela rede Docker `frontend`
    location / {
        proxy_pass         http://app:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts para aplicações que fazem operações longas
        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;
    }

    # Endpoint de health (acessível via HTTP e HTTPS)
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
